name: Daily data refresh

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch data
        run: python scripts/run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "auto-pulse-bot"
          git config user.email "auto-pulse-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
